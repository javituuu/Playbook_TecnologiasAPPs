<ion-header><ion-toolbar><ion-title>Equipo</ion-title></ion-toolbar></ion-header>
<ion-content>
  <main class="page-wrap">
    <p class="eyebrow">Equipo · Temporada 2025</p>
    <h1>Plantel de Valorant</h1>
    <div class="team-banner"><img src="assets/team-photo.jpg" alt="Jugador de esports compitiendo en un torneo" /><div><span>UDD</span><strong>WOLVES</strong><small>VALORANT · DIVISIÓN 1</small></div></div>
    <div class="section-heading roster-head"><div><p class="eyebrow">Roster activo</p><h2>Los titulares</h2></div><span>4 jugadores</span></div>
    <div class="roster">
      <button class="player-card" *ngFor="let jugador of jugadores" type="button" (click)="seleccionar(jugador.nombre)" [class.selected]="jugadorSeleccionado === jugador.nombre" [attr.aria-expanded]="jugadorSeleccionado === jugador.nombre">
        <span class="avatar"><img [src]="jugador.foto" [alt]="'Retrato de ' + jugador.nombre" /><b>{{ jugador.numero }}</b></span>
        <span class="player-copy"><strong>{{ jugador.nombre }}</strong><small>{{ jugador.rol }} · <i>{{ jugador.nick }}</i></small><span class="agent" *ngIf="jugadorSeleccionado === jugador.nombre">Agentes: {{ jugador.juego }}</span></span>
        <ion-icon [icon]="jugadorSeleccionado === jugador.nombre ? checkmarkCircle : chevronForwardOutline" aria-hidden="true"></ion-icon>
      </button>
    </div>
    <section class="team-note"><ion-icon [icon]="calendarOutline" aria-hidden="true"></ion-icon><div><strong>Próxima práctica</strong><p>Jueves, 18:30 · Sala de entrenamiento</p></div></section>
    <ion-button class="next-link" fill="clear" routerLink="/tabs/entrenamiento">Ir al plan de entrenamiento <span aria-hidden="true">→</span></ion-button>
  </main>
</ion-content>
